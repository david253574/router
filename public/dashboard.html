<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-section" class="container" style="display: none; max-width: 400px; margin-top: 50px;">
        <h1>Admin Login</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" style="width: 100%;">Login</button>
        </form>
        <div id="login-message" class="message"></div>
    </div>

    <div id="app-section" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Redirect Manager</h1>
            <button id="logout-btn" class="danger">Logout</button>
        </div>
        
        <div id="config-banner" class="message" style="display: none; margin-bottom: 20px;"></div>
        
        <h2>Create a Redirect</h2>
        <form id="redirect-form">
            <div class="form-group">
                <label for="alias">Alias (e.g., david):</label>
                <input type="text" id="alias" required>
            </div>
            <div class="form-group">
                <label for="destination_url">Destination URL:</label>
                <input type="url" id="destination_url" required placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="expires_at">Expiration (Optional):</label>
                <input type="datetime-local" id="expires_at">
            </div>
            <button type="submit">Create Redirect</button>
        </form>
        <div id="message" class="message"></div>

        <h2>Existing Redirects</h2>
        <table id="redirects-table">
            <thead>
                <tr>
                    <th>Alias</th>
                    <th>Destination</th>
                    <th>Status</th>
                    <th>Expiration</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be injected here -->
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
